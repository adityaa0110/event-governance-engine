services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-governance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-governance}
      POSTGRES_DB: ${POSTGRES_DB:-governance}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U governance -d governance"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-governance}:${POSTGRES_PASSWORD:-governance}@postgres:5432/${POSTGRES_DB:-governance}
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      LLM_API_KEY: ${LLM_API_KEY:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-0}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ${TLS_CERT_DIR:-./deploy/certs}:/etc/nginx/certs
    depends_on:
      api:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-governance}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-governance}
      PGDATABASE: ${POSTGRES_DB:-governance}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_ALERT_WEBHOOK: ${ALERT_WEBHOOK_URL:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
      - ./deploy/backup-postgres.sh:/backup.sh:ro
      - ./deploy/restore-postgres.sh:/restore.sh:ro
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh || true; sleep $${BACKUP_INTERVAL_SECONDS:-86400}; done"]

volumes:
  pgdata:
